plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'app.curio'
    compileSdk 35

    defaultConfig {
        applicationId "app.curio"
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // A fixed key so every new build installs as an update over the previous one.
    signingConfigs {
        curio {
            storeFile file('curio.keystore')
            storePassword 'curio-app'
            keyAlias 'curio'
            keyPassword 'curio-app'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.curio
        }
        debug {
            signingConfig signingConfigs.curio
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
